name: Temporary Scout formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Lendle-King/EpiPilot' && github.head_ref == 'dev/research-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/research-intelligence
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Format research modules and tests
        run: |
          ruff check --fix --exit-zero src/epipilot/research tests/research
          ruff format src/epipilot/research tests/research
      - name: Push mechanical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/epipilot/research tests/research
          if ! git diff --cached --quiet; then
            git commit -m 'style(research): format bounded Scout discovery'
            git push origin HEAD:dev/research-intelligence
          fi
