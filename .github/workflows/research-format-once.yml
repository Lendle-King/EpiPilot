name: One-shot research formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/research-plugin-evidence-and-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install 'ruff>=0.6'
      - name: Format research changes
        run: |
          ruff check --fix --exit-zero src/epipilot/research tests/research
          ruff format src/epipilot/research tests/research
      - name: Commit deterministic formatting only
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/epipilot/research tests/research
          if ! git diff --cached --quiet; then
            git commit -m 'style(research): apply Ruff formatting and safe fixes'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
